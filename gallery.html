<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rderg · gallery</title>
  <meta name="description" content="rderg's artworks and NFTs.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#081230">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="rderg">
  <meta property="og:title" content="rderg · gallery">
  <meta property="og:description" content="rderg's artworks and NFTs.">
  <meta property="og:url" content="https://rderg.com/gallery.html">
  <meta property="og:image" content="https://rderg.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="subpage">
    <a class="back-link" href="./">← back home</a>

    <header class="subpage-header">
      <h1 class="section-title">gallery</h1>
      <p class="section-hint">stuff i made. tap anything to see it bigger.</p>
      <div class="filters" id="filters" role="group" aria-label="Filter the gallery">
        <button class="filter active" data-filter="all">all</button>
        <button class="filter" data-filter="art">🎨 art</button>
        <button class="filter" data-filter="nft">💎 nfts</button>
      </div>
    </header>

    <div class="gallery-grid" id="galleryGrid"></div>
    <p class="gallery-empty" id="galleryEmpty" hidden>nothing here yet… check back soon 👀</p>
  </main>

  <dialog class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <div class="lightbox-media" id="lightboxMedia"></div>
    <div class="lightbox-info">
      <span class="tag" id="lightboxTag"></span>
      <h2 id="lightboxTitle"></h2>
      <p id="lightboxNote"></p>
      <a class="hero-cta" id="lightboxLink" target="_blank" rel="noopener" hidden>view it ↗</a>
    </div>
  </dialog>

  <footer class="footer"></footer>

  <script src="site.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
