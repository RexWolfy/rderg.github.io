<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rderg</title>
  <meta name="description" content="rderg's corner of the internet.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✌️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <p class="hero-hi">yo whaddup 👋 i'm</p>
    <h1 class="hero-name" id="heroName" aria-label="rderg">rderg</h1>
    <p class="hero-tagline">
      currently <span class="rotator" id="rotator">vibing</span>
    </p>
    <a class="hero-cta" href="#stuff">see what i'm into ↓</a>
  </header>

  <div class="ticker-wrap" aria-hidden="true">
    <div class="ticker">
      <div class="ticker-track" id="tickerTrack"></div>
    </div>
  </div>

  <main>
    <section id="stuff" class="section">
      <h2 class="section-title">stuff i'm into</h2>
      <p class="section-hint">tap a sticker to check it out. on a computer you can drag them around too.</p>
      <div class="board" id="board"></div>
    </section>

    <section class="section">
      <h2 class="section-title">random fact machine</h2>
      <div class="fact-box">
        <p class="fact" id="fact">press the button. you know you want to.</p>
        <button class="fact-btn" id="factBtn">gimme a fact 🎲</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer-walk">
      <svg class="walker" viewBox="0 0 13 9" aria-hidden="true" shape-rendering="crispEdges">
        <g class="walker-frame f1">
          <rect x="2" y="1" width="9" height="6" />
          <rect x="0" y="3" width="2" height="2" />
          <rect x="11" y="3" width="2" height="2" />
          <rect class="walker-eye" x="4" y="2" width="1" height="2" />
          <rect class="walker-eye" x="8" y="2" width="1" height="2" />
          <rect x="3" y="7" width="1" height="2" />
          <rect x="7" y="7" width="1" height="2" />
          <rect x="5" y="7" width="1" height="1" />
          <rect x="9" y="7" width="1" height="1" />
        </g>
        <g class="walker-frame f2">
          <rect x="2" y="0" width="9" height="6" />
          <rect x="0" y="2" width="2" height="2" />
          <rect x="11" y="2" width="2" height="2" />
          <rect class="walker-eye" x="4" y="1" width="1" height="2" />
          <rect class="walker-eye" x="8" y="1" width="1" height="2" />
          <rect x="3" y="6" width="1" height="3" />
          <rect x="7" y="6" width="1" height="3" />
          <rect x="5" y="6" width="1" height="3" />
          <rect x="9" y="6" width="1" height="3" />
        </g>
        <g class="walker-frame f3">
          <rect x="2" y="1" width="9" height="6" />
          <rect x="0" y="3" width="2" height="2" />
          <rect x="11" y="3" width="2" height="2" />
          <rect class="walker-eye" x="4" y="2" width="1" height="2" />
          <rect class="walker-eye" x="8" y="2" width="1" height="2" />
          <rect x="5" y="7" width="1" height="2" />
          <rect x="9" y="7" width="1" height="2" />
          <rect x="3" y="7" width="1" height="1" />
          <rect x="7" y="7" width="1" height="1" />
        </g>
        <g class="walker-frame f4">
          <rect x="2" y="0" width="9" height="6" />
          <rect x="0" y="2" width="2" height="2" />
          <rect x="11" y="2" width="2" height="2" />
          <rect class="walker-eye" x="4" y="1" width="1" height="2" />
          <rect class="walker-eye" x="8" y="1" width="1" height="2" />
          <rect x="3" y="6" width="1" height="3" />
          <rect x="7" y="6" width="1" height="3" />
          <rect x="5" y="6" width="1" height="3" />
          <rect x="9" y="6" width="1" height="3" />
        </g>
      </svg>
      <a href="https://github.com/rderg">github</a>
      <span aria-hidden="true">·</span>
      made by claude
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
