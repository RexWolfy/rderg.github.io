<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rderg</title>
  <meta name="description" content="rderg's corner of the internet.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#081230">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="rderg">
  <meta property="og:title" content="rderg">
  <meta property="og:description" content="rderg's corner of the internet.">
  <meta property="og:url" content="https://rderg.com/">
  <meta property="og:image" content="https://rderg.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <p class="hero-hi">yo whaddup 👋 i'm</p>
    <h1 class="hero-name" id="heroName" aria-label="rderg">rderg</h1>
    <p class="hero-tagline">
      currently <span class="rotator" id="rotator">vibing</span>
    </p>
    <a class="hero-cta" href="#stuff">see what i'm into ↓</a>
  </header>

  <div class="ticker-wrap" aria-hidden="true">
    <div class="ticker">
      <div class="ticker-track" id="tickerTrack"></div>
    </div>
  </div>

  <main>
    <section id="stuff" class="section">
      <h2 class="section-title">stuff i'm into</h2>
      <p class="section-hint">tap a sticker to check it out.</p>
      <div class="board" id="board"></div>
    </section>

    <section class="section">
      <h2 class="section-title">random fact machine</h2>
      <div class="fact-box">
        <p class="fact" id="fact">press the button. you know you want to.</p>
        <button class="fact-btn" id="factBtn">gimme a fact 🎲</button>
      </div>
    </section>
  </main>

  <footer class="footer" data-home></footer>

  <script src="site.js"></script>
  <script src="script.js"></script>
</body>
</html>
